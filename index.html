<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Autovion — AI Video Engine</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#04050a;color:#f1f5f9;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:#1e2240;border-radius:99px}
    input,textarea{background:#0d1020;border:1.5px solid #1a1f38;color:#f1f5f9;font-family:'Outfit',sans-serif;font-size:14px;outline:none;border-radius:10px;width:100%;padding:11px 14px;transition:border-color .2s,box-shadow .2s}
    input:focus,textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
    input::placeholder,textarea::placeholder{color:#334155}
    button{cursor:pointer;font-family:'Outfit',sans-serif;border:none;outline:none;transition:all .2s}
    button:disabled{opacity:.35;cursor:not-allowed!important}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(124,58,237,.3)}50%{box-shadow:0 0 50px rgba(124,58,237,.65)}}
    .fu{animation:fadeUp .4s ease both}
    .fi{animation:fadeIn .3s ease both}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const BACKEND = "https://autovion2.onrender.com";

const uid   = () => Math.random().toString(36).slice(2, 9);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtDur = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

function useLS(key, init) {
  const [v, set] = useState(() => {
    try { return JSON.parse(localStorage.getItem(key)) ?? init; }
    catch { return init; }
  });
  const save = useCallback(x => { set(x); try { localStorage.setItem(key, JSON.stringify(x)); } catch {} }, [key]);
  return [v, save];
}

async function callClaude(prompt, maxTokens = 3000) {
  const r = await fetch(`${BACKEND}/api/claude`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, maxTokens }),
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || `Erro ${r.status}`);
  }
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
  return d.content?.map(i => i.text || "").join("") || "";
}

const ESTILOS = [
  { id:"viral",        e:"⚡", l:"Viral / Hype",      d:"Gancho agressivo, ritmo acelerado" },
  { id:"dark",         e:"🌑", l:"Dark & Misterioso", d:"Atmosférico, sombrio, intrigante" },
  { id:"motivacional", e:"🔥", l:"Motivacional",       d:"Alta energia, frases de impacto" },
  { id:"curiosidades", e:"🧠", l:"Curiosidades",       d:"Fatos surpreendentes e didáticos" },
  { id:"relaxante",    e:"🌊", l:"Relaxante",          d:"Tom calmo e contemplativo" },
];

const VOZES = [
  { id:"echo",    l:"Echo",    d:"Masculino, grave",     i:"🎙️" },
  { id:"onyx",    l:"Onyx",    d:"Profundo, dramático",  i:"🔊" },
  { id:"nova",    l:"Nova",    d:"Feminino, expressivo", i:"✨" },
  { id:"shimmer", l:"Shimmer", d:"Suave, narrativo",     i:"🌟" },
];

const PIPELINE = [
  { id:"script", i:"📝", l:"Gerando Roteiro com IA",   ms:0    },
  { id:"voice",  i:"🎙️", l:"Sintetizando Narração",    ms:2000 },
  { id:"images", i:"🖼️", l:"Gerando Imagens",           ms:2500 },
  { id:"edit",   i:"✂️", l:"Editando Transições",      ms:1500 },
  { id:"render", i:"⚙️", l:"Renderizando Vídeo Final", ms:2000 },
  { id:"export", i:"📦", l:"Exportando MP4",            ms:1000 },
];

const PLANOS = [
  { id:"free",   n:"Free",   p:0,   c:"#64748b", f:["3 vídeos/mês","Roteiro IA","720p"] },
  { id:"pro",    n:"Pro",    p:47,  c:"#8b5cf6", f:["30 vídeos/mês","1080p","ARIA IA","Todas as vozes"], star:true },
  { id:"agency", n:"Agency", p:197, c:"#f59e0b", f:["Ilimitado","4K","API access","Suporte"] },
];

const Spin = ({ s=16, c="#a78bfa" }) => (
  <span style={{ display:"inline-block", width:s, height:s, border:`2px solid ${c}22`, borderTopColor:c, borderRadius:"50%", animation:"spin .65s linear infinite", flexShrink:0 }}/>
);

function Logo({ sm }) {
  const fs = sm ? 16 : 20, ls = sm ? 28 : 36;
  return (
    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
      <div style={{ width:ls, height:ls, background:"linear-gradient(135deg,#7c3aed,#4338ca)", borderRadius:ls*.27, display:"flex", alignItems:"center", justifyContent:"center", fontSize:ls*.47, boxShadow:"0 4px 18px rgba(124,58,237,.55)", animation:"float 4s ease-in-out infinite", flexShrink:0 }}>▶</div>
      <div>
        <div style={{ fontWeight:900, fontSize:fs, letterSpacing:"-.03em", lineHeight:1 }}>
          Auto<span style={{ background:"linear-gradient(135deg,#a78bfa,#22d3ee)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>vion</span>
        </div>
        {!sm && <div style={{ fontSize:9, color:"#475569", letterSpacing:".12em", fontWeight:700, marginTop:1 }}>AI VIDEO ENGINE</div>}
      </div>
    </div>
  );
}

const Pill = ({ children, c="#8b5cf6" }) => (
  <span style={{ background:c+"1a", color:c, border:`1px solid ${c}33`, borderRadius:99, padding:"2px 10px", fontSize:11, fontWeight:700, display:"inline-block" }}>{children}</span>
);

const Card = ({ children, style={}, ...p }) => (
  <div style={{ background:"#080c1a", border:"1.5px solid #131830", borderRadius:14, ...style }} {...p}>{children}</div>
);

function Auth({ onLogin }) {
  const [tab, setTab]   = useState("login");
  const [nm, setNm]     = useState("");
  const [em, setEm]     = useState("");
  const [pw, setPw]     = useState("");
  const [load, setLoad] = useState(false);
  const [msg, setMsg]   = useState(null);

  async function go() {
    setMsg(null);
    if (!em) return setMsg({ e:true, t:"Digite seu e-mail." });
    if (tab !== "forgot" && !pw) return setMsg({ e:true, t:"Digite sua senha." });
    if (tab === "register" && !nm) return setMsg({ e:true, t:"Digite seu nome." });
    setLoad(true); await sleep(800); setLoad(false);
    if (tab === "forgot") return setMsg({ e:false, t:"✅ Link enviado! Verifique seu e-mail." });
    onLogin({ id:uid(), nome:nm||em.split("@")[0], email:em, plano:"free", creditos:3 });
  }

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:20, background:"#04050a", position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:"-15%", left:"-10%", width:"55vw", height:"55vw", background:"radial-gradient(circle,rgba(124,58,237,.07),transparent 70%)", borderRadius:"50%", pointerEvents:"none" }}/>
      <div style={{ width:"100%", maxWidth:400 }} className="fu">
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ display:"inline-flex" }}><Logo/></div>
          <div style={{ marginTop:10, color:"#475569", fontSize:14 }}>Crie vídeos virais com inteligência artificial</div>
        </div>
        <div style={{ background:"#080c1a", border:"1.5px solid #131830", borderRadius:18, padding:28 }}>
          {tab !== "forgot" && (
            <div style={{ display:"flex", background:"#0d1020", borderRadius:10, padding:4, marginBottom:22, gap:4 }}>
              {[["login","Entrar"],["register","Criar conta"]].map(([t,l]) => (
                <button key={t} onClick={()=>{setTab(t);setMsg(null);}} style={{ flex:1, padding:"9px", borderRadius:8, fontSize:14, fontWeight:600, background:tab===t?"#131830":"transparent", color:tab===t?"#f1f5f9":"#475569" }}>{l}</button>
              ))}
            </div>
          )}
          {tab === "forgot" && (
            <div style={{ marginBottom:18 }}>
              <button onClick={()=>setTab("login")} style={{ background:"none", color:"#475569", fontSize:13 }}>← Voltar</button>
              <div style={{ fontWeight:800, fontSize:19, marginTop:6 }}>Recuperar senha</div>
            </div>
          )}
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            {tab === "register" && <input value={nm} onChange={e=>setNm(e.target.value)} placeholder="Seu nome completo"/>}
            <input type="email" value={em} onChange={e=>setEm(e.target.value)} placeholder="voce@email.com" onKeyDown={e=>e.key==="Enter"&&go()}/>
            {tab !== "forgot" && (
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                  <span style={{ fontSize:12, color:"#334155" }}>Senha</span>
                  {tab==="login" && <button onClick={()=>setTab("forgot")} style={{ background:"none", color:"#7c3aed", fontSize:12, fontWeight:600 }}>Esqueceu?</button>}
                </div>
                <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&go()}/>
              </div>
            )}
            {msg && <div style={{ background:msg.e?"rgba(239,68,68,.1)":"rgba(16,185,129,.1)", border:`1.5px solid ${msg.e?"rgba(239,68,68,.3)":"rgba(16,185,129,.3)"}`, borderRadius:9, padding:"10px 14px", color:msg.e?"#ef4444":"#10b981", fontSize:13 }}>{msg.t}</div>}
            <button onClick={go} disabled={load} style={{ background:"linear-gradient(135deg,#7c3aed,#4338ca)", color:"white", borderRadius:12, padding:"13px", fontSize:15, fontWeight:700, marginTop:2, display:"flex", alignItems:"center", justifyContent:"center", gap:8, boxShadow:"0 4px 20px rgba(124,58,237,.4)" }}>
              {load?<><Spin s={18} c="white"/>Aguarde...</>:tab==="login"?"Entrar na plataforma":tab==="register"?"Criar minha conta":"Enviar link"}
            </button>
          </div>
          <div style={{ marginTop:20, paddingTop:16, borderTop:"1px solid #131830", textAlign:"center", fontSize:12, color:"#334155" }}>
            Mais de <span style={{ color:"#8b5cf6", fontWeight:700 }}>12.400 criadores</span> já usam o Autovion
          </div>
        </div>
      </div>
    </div>
  );
}

function Pipeline({ open, step, erro, onDone, onRetry }) {
  if (!open) return null;
  const pct  = Math.min(Math.round((step/PIPELINE.length)*100),100);
  const done = step >= PIPELINE.length;
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(4,5,10,.96)", backdropFilter:"blur(20px)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div className="fu" style={{ background:"#080c1a", border:`1.5px solid ${erro?"rgba(239,68,68,.5)":"rgba(124,58,237,.45)"}`, borderRadius:22, width:"100%", maxWidth:460, padding:30 }}>
        <div style={{ textAlign:"center", marginBottom:24 }}>
          <div style={{ width:68, height:68, borderRadius:20, background:erro?"rgba(239,68,68,.15)":"linear-gradient(135deg,#7c3aed,#4338ca)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:30, margin:"0 auto 14px", animation:done||erro?"none":"spin 4s linear infinite" }}>
            {erro?"❌":done?"✅":"⚙️"}
          </div>
          <div style={{ fontWeight:900, fontSize:20, marginBottom:4 }}>{erro?"Ops, algo deu errado":done?"Vídeo Pronto! 🎬":"Gerando seu vídeo..."}</div>
          <div style={{ color:"#475569", fontSize:13 }}>{erro||( done?"Pipeline concluído!":`Etapa ${Math.min(step+1,PIPELINE.length)} de ${PIPELINE.length}`)}</div>
        </div>
        {!erro && <>
          <div style={{ marginBottom:18 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:7 }}>
              <span style={{ color:"#475569" }}>Progresso</span>
              <span style={{ color:"#8b5cf6", fontWeight:700 }}>{pct}%</span>
            </div>
            <div style={{ height:5, background:"#131830", borderRadius:5, overflow:"hidden" }}>
              <div style={{ height:"100%", background:"linear-gradient(90deg,#7c3aed,#22d3ee)", borderRadius:5, width:`${pct}%`, transition:"width .6s ease" }}/>
            </div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:22 }}>
            {PIPELINE.map((s,i)=>{
              const feito=i<step, atual=i===step;
              return (
                <div key={s.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 13px", borderRadius:11, background:atual?"rgba(124,58,237,.1)":feito?"rgba(16,185,129,.06)":"transparent", border:`1px solid ${atual?"rgba(124,58,237,.4)":feito?"rgba(16,185,129,.2)":"#131830"}` }}>
                  <div style={{ width:28, height:28, borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, background:feito?"rgba(16,185,129,.18)":atual?"rgba(124,58,237,.18)":"#0d1020", flexShrink:0 }}>
                    {feito?"✓":atual?<Spin s={13} c="#a78bfa"/>:s.i}
                  </div>
                  <span style={{ fontSize:13, fontWeight:500, color:feito?"#10b981":atual?"#a78bfa":"#334155", flex:1 }}>{s.l}</span>
                  {atual&&<span style={{ fontSize:10, color:"#7c3aed", animation:"pulse 1.4s infinite" }}>processando...</span>}
                </div>
              );
            })}
          </div>
        </>}
        {done&&!erro&&<button onClick={onDone} style={{ width:"100%", padding:13, background:"linear-gradient(135deg,#7c3aed,#4338ca)", color:"white", borderRadius:12, fontSize:15, fontWeight:700 }}>🎬 Ver Vídeo Gerado →</button>}
        {erro&&<button onClick={onRetry} style={{ width:"100%", padding:13, background:"#0d1020", border:"1.5px solid #131830", color:"#f1f5f9", borderRadius:12, fontSize:15, fontWeight:600 }}>← Tentar novamente</button>}
      </div>
    </div>
  );
}

function Criar({ onCriado, user }) {
  const [tema, setTema] = useState("");
  const [est, setEst]   = useState("viral");
  const [voz, setVoz]   = useState("echo");
  const [fmt, setFmt]   = useState("youtube");
  const [load, setLoad] = useState(false);
  const [step, setStep] = useState(-1);
  const [erro, setErro] = useState("");
  const [pErr, setPErr] = useState("");

  const pode = user.plano !== "free" || (user.creditos||0) > 0;

  async function gerar() {
    if (!tema.trim()) return setErro("Digite um tema para o vídeo.");
    if (!pode)        return setErro("Créditos esgotados. Faça upgrade.");
    setErro(""); setPErr(""); setLoad(true); setStep(0);
    try {
      const prompt = `Você é um roteirista expert em conteúdo viral para YouTube com milhões de views.
Crie um roteiro COMPLETO sobre: "${tema}"
Estilo: ${est.toUpperCase()}
Formato: ${fmt==="shorts"?"YouTube Shorts — máximo 60s, 3-4 cenas":"YouTube — 90 a 150s, 5-7 cenas"}
REGRAS: Gancho nos 3 primeiros segundos, cliffhanger entre cenas, linguagem conversacional.
RETORNE APENAS JSON VÁLIDO SEM TEXTO ADICIONAL:
{"titulo":"Título SEO","descricao":"1 linha","tags":["t1","t2","t3"],"duracao_total":120,"hook_score":8.5,"cenas":[{"numero":1,"titulo":"Nome","narracao":"Texto narrado.","descricao_visual":"Visual","prompt_imagem":"Cinematic prompt English","duracao":20,"emocao":"intriga"}]}`;

      const raw    = await callClaude(prompt);
      const script = JSON.parse(raw.replace(/```json|```/g,"").trim());

      for (let i = 1; i < PIPELINE.length; i++) {
        setStep(i);
        await sleep(PIPELINE[i].ms);
      }
      setStep(PIPELINE.length);
      onCriado({ id:uid(), tema, estilo:est, voz, formato:fmt, status:"ready", script, criadoEm:new Date().toISOString() });
    } catch(e) {
      setPErr(e.message || "Erro desconhecido.");
      setLoad(false);
    }
  }

  return (
    <div style={{ maxWidth:640, margin:"0 auto" }}>
      <Pipeline open={step>=0&&load} step={step} erro={pErr} onDone={()=>{setLoad(false);setStep(-1);}} onRetry={()=>{setLoad(false);setStep(-1);setPErr("");}}/>
      <div style={{ marginBottom:24 }}>
        <div style={{ fontWeight:900, fontSize:24, letterSpacing:"-.02em", marginBottom:4 }}>
          Criar Vídeo <span style={{ background:"linear-gradient(135deg,#a78bfa,#22d3ee)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>com IA</span>
        </div>
        <div style={{ color:"#475569", fontSize:14 }}>Do tema ao vídeo em 1 clique. Pipeline 100% automatizado.</div>
      </div>

      {!pode && <div style={{ background:"rgba(239,68,68,.08)", border:"1.5px solid rgba(239,68,68,.25)", borderRadius:12, padding:"12px 16px", marginBottom:14, color:"#ef4444", fontSize:13 }}>⚠️ Créditos esgotados. Faça upgrade para continuar.</div>}

      <Card style={{ padding:18, marginBottom:12 }}>
        <div style={{ fontSize:11, color:"#334155", fontWeight:700, letterSpacing:".08em", marginBottom:8 }}>TEMA DO VÍDEO *</div>
        <input value={tema} onChange={e=>{setTema(e.target.value);setErro("");}} placeholder="Ex: A verdade sombria sobre dormir menos de 6 horas..." onKeyDown={e=>e.key==="Enter"&&gerar()}/>
        {erro && <div style={{ color:"#ef4444", fontSize:12, marginTop:6 }}>{erro}</div>}
        <div style={{ fontSize:11, color:"#334155", marginTop:5 }}>💡 Temas específicos e provocativos geram mais retenção</div>
      </Card>

      <Card style={{ padding:18, marginBottom:12 }}>
        <div style={{ fontSize:11, color:"#334155", fontWeight:700, letterSpacing:".08em", marginBottom:12 }}>ESTILO NARRATIVO</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
          {ESTILOS.map(s=>(
            <div key={s.id} onClick={()=>setEst(s.id)} style={{ padding:"11px 12px", borderRadius:11, cursor:"pointer", background:est===s.id?"rgba(124,58,237,.12)":"#0d1020", border:`1.5px solid ${est===s.id?"rgba(124,58,237,.5)":"#131830"}`, display:"flex", alignItems:"center", gap:9 }}>
              <span style={{ fontSize:17 }}>{s.e}</span>
              <div>
                <div style={{ fontSize:12, fontWeight:700, color:est===s.id?"#a78bfa":"#f1f5f9" }}>{s.l}</div>
                <div style={{ fontSize:10, color:"#334155" }}>{s.d}</div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
        <Card style={{ padding:16 }}>
          <div style={{ fontSize:11, color:"#334155", fontWeight:700, letterSpacing:".08em", marginBottom:10 }}>VOZ</div>
          {VOZES.map(v=>(
            <div key={v.id} onClick={()=>setVoz(v.id)} style={{ padding:"8px 10px", borderRadius:9, cursor:"pointer", marginBottom:5, background:voz===v.id?"rgba(79,70,229,.14)":"#0d1020", border:`1.5px solid ${voz===v.id?"rgba(99,102,241,.5)":"#131830"}`, display:"flex", alignItems:"center", gap:8 }}>
              <span>{v.i}</span>
              <div>
                <div style={{ fontSize:12, fontWeight:600, color:voz===v.id?"#818cf8":"#f1f5f9" }}>{v.l}</div>
                <div style={{ fontSize:10, color:"#334155" }}>{v.d}</div>
              </div>
            </div>
          ))}
        </Card>
        <Card style={{ padding:16 }}>
          <div style={{ fontSize:11, color:"#334155", fontWeight:700, letterSpacing:".08em", marginBottom:10 }}>FORMATO</div>
          {[{id:"youtube",l:"YouTube",r:"16:9",i:"▶️"},{id:"shorts",l:"Shorts/TikTok",r:"9:16",i:"📱"}].map(f=>(
            <div key={f.id} onClick={()=>setFmt(f.id)} style={{ padding:"10px 12px", borderRadius:10, c
