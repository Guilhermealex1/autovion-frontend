const { useState, useEffect, useRef, useCallback } = React;

// ─── UTILS ───────────────────────────────────────────────────

const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt   = s  => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`;

function useLS(key, init) {
  const [v, sv] = useState(() => {
    try { return JSON.parse(localStorage.getItem(key)) ?? init; }
    catch { return init; }
  });
  const set = useCallback(x => { sv(x); localStorage.setItem(key, JSON.stringify(x)); }, [key]);
  return [v, set];
}

// ─── CHAMADA CLAUDE API ───────────────────────────────────────
async function callClaude(prompt, apiKey) {
  if (!apiKey) throw new Error("API key não configurada");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 3000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Erro ${res.status}`);
  }
  const data = await res.json();
  return data.content?.map(i => i.text || "").join("") || "";
}

// ─── STREAMING PARA ARIA ──────────────────────────────────────
async function callClaudeStream(system, messages, apiKey, onChunk) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 2048,
      stream: true,
      system,
      messages,
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Erro ${res.status}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    for (const line of dec.decode(value, { stream: true }).split("\n")) {
      if (!line.startsWith("data: ")) continue;
      const d = line.slice(6).trim();
      if (d === "[DONE]") continue;
      try {
        const j = JSON.parse(d);
        if (j.type === "content_block_delta" && j.delta?.type === "text_delta") {
          full += j.delta.text;
          onChunk(j.delta.text);
        }
      } catch {}
    }
  }
  return full;
}

// ─── TELA DE AUTH ─────────────────────────────────────────────
function AuthScreen({ onLogin }) {
  const [modo, setModo]   = useState("login");
  const [nome, setNome]   = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [loading, setLoading] = useState(false);
  const [erro, setErro]   = useState("");

  async function entrar() {
    setErro("");
    if (!email) return setErro("Digite seu e-mail.");
    if (!senha && modo !== "forgot") return setErro("Digite sua senha.");
    if (modo === "register" && !nome) return setErro("Digite seu nome.");
    setLoading(true);
    await sleep(1000);
    setLoading(false);
    if (modo === "forgot") return setErro("✅ Link enviado! Verifique seu e-mail.");
    onLogin({ id:uid(), nome: nome||email.split("@")[0], email, plano:"free", creditos:3 });
  }

  return (
    <div style={{ minHeight:"100vh", background:"#04050a", display:"flex", alignItems:"center", justifyContent:"center", padding:20, position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:"-10%", left:"-10%", width:"50vw", height:"50vw", background:"radial-gradient(circle, rgba(124,58,237,.08) 0%, transparent 70%)", borderRadius:"50%", pointerEvents:"none" }}/>
      <div style={{ width:"100%", maxWidth:400 }} className="fade-up">
        <div style={{ textAlign:"center", marginBottom:32 }}>
          <div style={{ display:"inline-flex" }}><Logo/></div>
          <div style={{ marginTop:10, color:"#64748b", fontSize:14 }}>Crie vídeos virais com inteligência artificial</div>
        </div>
        <div style={{ background:"#0c0f1c", border:"1px solid #1a1f38", borderRadius:16, padding:28, boxShadow:"0 0 40px rgba(139,92,246,.08)" }}>
          {modo !== "forgot" && (
            <div style={{ display:"flex", background:"#111428", borderRadius:10, padding:4, marginBottom:24 }}>
              {[["login","Entrar"],["register","Criar conta"]].map(([m,l]) => (
                <button key={m} onClick={()=>{setModo(m);setErro("");}} style={{ flex:1, padding:"8px", borderRadius:8, border:"none", fontSize:14, fontWeight:600, background:modo===m?"#161b33":"transparent", color:modo===m?"#f8fafc":"#64748b" }}>{l}</button>
              ))}
            </div>
          )}
          {modo==="forgot" && (
            <div style={{ marginBottom:20 }}>
              <button onClick={()=>setModo("login")} style={{ background:"none", border:"none", color:"#64748b", fontSize:13 }}>← Voltar</button>
              <div style={{ fontWeight:700, fontSize:18, marginTop:6 }}>Recuperar senha</div>
            </div>
          )}
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            {modo==="register" && <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Seu nome completo" style={{ padding:"11px 14px" }}/>}
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="voce@email.com" style={{ padding:"11px 14px" }} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
            {modo!=="forgot" && (
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                  <span style={{ fontSize:12, color:"#475569" }}>Senha</span>
                  {modo==="login" && <button onClick={()=>setModo("forgot")} style={{ background:"none", border:"none", color:"#a78bfa", fontSize:12 }}>Esqueceu?</button>}
                </div>
                <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••" style={{ padding:"11px 14px" }} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
              </div>

            <button onClick={entrar} disabled={loading} style={{ background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", borderRadius:12, padding:"13px", fontSize:15, fontWeight:700, marginTop:4, boxShadow:"0 4px 20px rgba(124,58,237,.4)", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
              {loading ? <><Spinner size={18} cor="white"/>Entrando...</> : modo==="login"?"Entrar na plataforma":modo==="register"?"Criar minha conta":"Enviar link"}
            </button>
          </div>

// ─── PIPELINE MODAL ───────────────────────────────────────────
function PipelineModal({ aberto, step, onConcluir }) {
  if (!aberto) return null;
  const pct = Math.min(Math.round((step / PIPELINE_STEPS.length) * 100), 100);
  const pronto = step >= PIPELINE_STEPS.length;
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(4,5,10,.93)", backdropFilter:"blur(16px)", zIndex:2000, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ background:"#0c0f1c", border:"1px solid rgba(139,92,246,.4)", borderRadius:20, width:"100%", maxWidth:460, padding:30, boxShadow:"0 0 60px rgba(139,92,246,.15)" }} className="fade-up">
        <div style={{ textAlign:"center", marginBottom:24 }}>
          <div style={{ width:68, height:68, borderRadius:18, background:"linear-gradient(135deg,#7c3aed,#4f46e5)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:30, margin:"0 auto 14px", boxShadow:"0 0 40px rgba(124,58,237,.5)", animation:pronto?"none":"spin 4s linear infinite" }}>
            {pronto ? "✅" : "⚙️"}
          </div>
          <div style={{ fontWeight:900, fontSize:20, marginBottom:4 }}>{pronto ? "Vídeo Pronto!" : "Gerando seu vídeo..."}</div>
          <div style={{ color:"#64748b", fontSize:13 }}>{pronto ? "Pipeline concluído!" : `Etapa ${Math.min(step+1, PIPELINE_STEPS.length)} de ${PIPELINE_STEPS.length}`}</div>
        </div>
        <div style={{ marginBottom:20 }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:6 }}>
            <span style={{ color:"#64748b" }}>Progresso</span>
            <span style={{ color:"#a78bfa", fontWeight:700 }}>{pct}%</span>
          </div>
          <div style={{ height:4, background:"#1a1f38", borderRadius:4, overflow:"hidden" }}>
            <div style={{ height:"100%", background:"linear-gradient(90deg,#7c3aed,#22d3ee)", borderRadius:4, width:`${pct}%`, transition:"width .5s ease" }}/>
          </div>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:20 }}>
          {PIPELINE_STEPS.map((s, i) => {
            const feito = i < step, atual = i === step;
            return (
              <div key={s.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px", borderRadius:10, background:atual?"rgba(139,92,246,.12)":feito?"rgba(16,185,129,.06)":"transparent", border:`1px solid ${atual?"rgba(139,92,246,.4)":feito?"rgba(16,185,129,.2)":"#1a1f38"}`, transition:"all .3s" }}>
                <div style={{ width:26, height:26, borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, background:feito?"rgba(16,185,129,.2)":atual?"rgba(139,92,246,.2)":"#111428", flexShrink:0 }}>
                  {feito ? "✓" : atual ? <Spinner size={12} cor="#a78bfa"/> : s.icon}
                </div>
                <span style={{ fontSize:13, fontWeight:500, color:feito?"#10b981":atual?"#a78bfa":"#475569" }}>{s.label}</span>
                {atual && <span style={{ marginLeft:"auto", fontSize:10, color:"#a78bfa", animation:"pulse 1.5s infinite" }}>processando...</span>}
              </div>
            );
          })}
        </div>
        {pronto && (
          <button onClick={onConcluir} style={{ width:"100%", padding:13, background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", borderRadius:12, fontSize:15, fontWeight:700, boxShadow:"0 4px 20px rgba(124,58,237,.4)" }}>
            🎬 Ver Vídeo Gerado →
          </button>
        )}
      </div>
    </div>
  );
}

// ─── PÁGINA CRIAR ─────────────────────────────────────────────
function PaginaCriar({ onCriado, usuario, apiKeys }) {
  const [tema, setTema]     = useState("");
  const [estilo, setEstilo] = useState("viral");
  const [voz, setVoz]       = useState("echo");
  const [formato, setFmt]   = useState("youtube");
  const [loading, setLoad]  = useState(false);
  const [pStep, setPStep]   = useState(-1);
  const [erro, setErro]     = useState("");

  const podeCriar = usuario.plano !== "free" || (usuario.creditos || 0) > 0;

  async function gerar() {
    if (!tema.trim()) return setErro("Digite um tema.");
    if (!podeCriar)   return setErro("Créditos esgotados. Faça upgrade.");
    if (!apiKeys.anthropic) return setErro("Configure sua API Key da Anthropic nas Configurações.");
    setErro(""); setLoad(true); setPStep(0);

    let script = null;
    try {
      const prompt = `Você é um roteirista expert em conteúdo viral para YouTube.
Crie um roteiro COMPLETO sobre: "${tema}"
Estilo: ${estilo.toUpperCase()}
Formato: ${formato === "shorts" ? "YouTube Shorts 60s" : "YouTube 90-150s"}
REGRAS: Gancho nos 3 primeiros segundos, cliffhanger entre cenas, linguagem conversacional.
Retorne APENAS JSON válido:
{"titulo":"Título SEO","descricao":"1 linha","tags":["t1","t2","t3"],"duracao_total":120,"hook_score":8.5,"cenas":[{"numero":1,"titulo":"Nome","narracao":"Texto narrado.","descricao_visual":"Visual","prompt_imagem":"DALL-E prompt english","duracao":20,"emocao":"intriga"}]}`;

      const raw = await callClaude(prompt, apiKeys.anthropic);
      script = JSON.parse(raw.replace(/```json|```/g, "").trim());
      await sleep(400);

      for (let i = 1; i < PIPELINE_STEPS.length; i++) {
        setPStep(i);
        await sleep(PIPELINE_STEPS[i].ms * 0.5);
      }
      setPStep(PIPELINE_STEPS.length);

      const proj = { id:uid(), tema, estilo, voz, formato, status:"ready", script, criadoEm:new Date().toISOString() };
      onCriado(proj);
    } catch(e) {
      setErro("Erro: " + e.message);
      setLoad(false); setPStep(-1);
    }
    setLoad(false);
  }

  return (
    <div style={{ maxWidth:660, margin:"0 auto" }}>
      <PipelineModal aberto={pStep >= 0 && loading} step={pStep} onConcluir={()=>{setLoad(false);setPStep(-1);}}/>

      <div style={{ marginBottom:24 }}>
        <div style={{ fontWeight:900, fontSize:24, letterSpacing:"-.02em", marginBottom:4 }}>
          Criar Vídeo <span style={{ background:"linear-gradient(135deg,#a78bfa,#22d3ee)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>com IA</span>
        </div>
        <div style={{ color:"#64748b", fontSize:14 }}>Do tema ao vídeo em 1 clique. Pipeline automatizado.</div>
      </div>

      {!podeCriar && (
        <div style={{ background:"rgba(244,63,94,.1)", border:"1px solid rgba(244,63,94,.3)", borderRadius:12, padding:"14px 18px", marginBottom:16 }}>
          <div style={{ fontWeight:600, color:"#f43f5e" }}>⚠️ Créditos esgotados</div>
          <div style={{ fontSize:13, color:"#64748b", marginTop:3 }}>Faça upgrade para continuar criando vídeos.</div>
        </div>
      )}

      <div style={{ background:"#0c0f1c", border:"1px solid #1a1f38", borderRadius:14, padding:18, marginBottom:12 }}>
        <label style={{ fontSize:11, color:"#475569", fontWeight:700, letterSpacing:".08em", display:"block", marginBottom:8 }}>TEMA DO VÍDEO *</label>
        <input value={tema} onChange={e=>{setTema(e.target.value);setErro("");}} placeholder="Ex: A verdade sombria sobre dormir menos de 6 horas..." style={{ padding:"12px 14px", fontSize:15 }} onKeyDown={e=>e.key==="Enter"&&gerar()}/>
        {erro && <div style={{ color:"#f43f5e", fontSize:12, marginTop:6 }}>{erro}</div>}
      </div>

      <div style={{ background:"#0c0f1c", border:"1px solid #1a1f38", borderRadius:14, padding:18, marginBottom:12 }}>
        <label style={{ fontSize:11, color:"#475569", fontWeight:700, letterSpacing:".08em", display:"block", marginBottom:10 }}>ESTILO NARRATIVO</label>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
          {ESTILOS.map(s => (
            <div key={s.id} onClick={()=>setEstilo(s.id)} style={{ padding:"11px 14px", borderRadius:11, cursor:"pointer", background:estilo===s.id?"rgba(139,92,246,.12)":"#111428", border:`1px solid ${estilo===s.id?"rgba(139,92,246,.5)":"#1a1f38"}`, transition:"all .15s", display:"flex", alignItems:"center", gap:9 }}>
              <span style={{ fontSize:17 }}>{s.emoji}</span>
              <div>
                <div style={{ fontSize:12, fontWeight:700, color:estilo===s.id?"#a78bfa":"#f8fafc" }}>{s.label}</div>
                <div style={{ fontSize:10, color:"#475569" }}>{s.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 }}>
        <div style={{ background:"#0c0f1c", border:"1px solid #1a1f38", borderRadius:14, padding:16 }}>
          <label style={{ fontSize:11, color:"#475569", fontWeight:700, letterSpacing:".08em", display:"block", marginBottom:10 }}>VOZ</label>
          {VOZES.map(v => (
            <div key={v.id} onClick={()=>setVoz(v.id)} style={{ padding:"8px 10px", borderRadius:9, cursor:"pointer", marginBottom:5, background:voz===v.id?"rgba(79,70,229,.15)":"#111428", border:`1px solid ${voz===v.id?"rgba(99,102,241,.5)":"#1a1f38"}`, display:"flex", alignItems:"center", gap:8, transition:"all .15s" }}>
              <span>{v.icon}</span>
              <div>
                <div style={{ fontSize:12, fontWeight:600, color:voz===v.id?"#818cf8":"#f8fafc" }}>{v.label}</div>
                <div style={{ fontSize:10, color:"#475569" }}>{v.desc}</div>
              </div>
            </div>
          ))}

// ─── ARIA PANEL v2 ────────────────────────────────────────────
function ARIAPanel({ projetos, apiKeys }) {
  const [chats, setChats]       = useLS("aria_chats_v2", []);
  const [chatId, setChatId]     = useState(null);
  const [input, setInput]       = useState("");
  const [streaming, setStreaming] = useState(false);
  const [streamTxt, setStreamTxt] = useState("");
  const [sb, setSb]             = useState(true);
  const [busca, setBusca]       = useState("");
  const fimRef = useRef(null);
  const taRef  = useRef(null);

  const chatAtual = chats.find(c => c.id === chatId) || null;
  const msgs = chatAtual?.msgs || [];

  useEffect(() => { fimRef.current?.scrollIntoView({ behavior:"smooth" }); }, [msgs.length, streamTxt]);

  useEffect(() => {
    if (taRef.current) {
      taRef.current.style.height = "auto";
      taRef.current.style.height = Math.min(taRef.current.scrollHeight, 140) + "px";
    }
  }, [input]);

  function novoChat() {
    const c = { id:uid(), titulo:"Nova Conversa", msgs:[], criadoEm:new Date().toISOString(), fixado:false };
    setChats(p => [c, ...p]);
    setChatId(c.id);
  }

  function upd(id, fn) { setChats(p => p.map(c => c.id===id ? fn(c) : c)); }

  async function enviar() {
    if (!input.trim() || streaming) return;
    if (!apiKeys.anthropic) return alert("Configure sua API Key da Anthropic nas Configurações!");

    const userInput = input.trim();
    const msgUser = { id:uid(), role:"user", content:userInput, ts:Date.now() };
    setInput("");

    let cid = chatId;
    if (!cid) {
      const nc = { id:uid(), titulo:userInput.slice(0,45), msgs:[msgUser], criadoEm:new Date().toISOString(), fixado:false };
      setChats(p => [nc, ...p]);
      cid = nc.id;
      setChatId(cid);
    } else {
      upd(cid, c => ({ ...c, msgs:[...c.msgs, msgUser], titulo:c.msgs.length===0?userInput.slice(0,45):c.titulo }));
    }

    setStreaming(true); setStreamTxt("");

    const prevMsgs = (chats.find(c=>c.id===cid)?.msgs || [])
      .filter(m => m.id !== msgUser.id)
      .slice(-20)
      .map(m => ({ role:m.role==="user"?"user":"assistant", content:m.content }));
    const apiMsgs = [...prevMsgs, { role:"user", content:userInput }];

    const ctx = projetos.length > 0
      ? `\n\nCONTEXTO DO USUÁRIO:\n- Vídeos criados: ${projetos.length}\n- Estilos: ${[...new Set(projetos.map(p=>p.estilo))].join(", ")}\n- Temas recentes: ${projetos.slice(0,3).map(p=>p.tema).join(" | ")}`
      : "";

    const system = `Você é ARIA, a assistente IA avançada do Autovion — plataforma de criação de vídeos com IA.

Personalidade: criativa, estratégica, direta. Especialista em marketing de conteúdo, SEO para vídeo, copywriting e tendências digitais. Linguagem natural e amigável. Respostas concisas (máximo 200 palavras) exceto quando solicitado detalhe.${ctx}`;

    try {
      let acc = "";
      await callClaudeStream(system, apiMsgs, apiKeys.anthropic, chunk => {
        acc += chunk;
        setStreamTxt(t => t + chunk);
      });
      upd(cid, c => ({ ...c, msgs:[...c.msgs, { id:uid(), role:"aria", content:acc, ts:Date.now() }] }));
    } catch(e) {
      upd(cid, c => ({ ...c, msgs:[...c.msgs, { id:uid(), role:"aria", content:`❌ ${e.message}`, ts:Date.now(), erro:true }] }));
    }
    setStreaming(false); setStreamTxt("");
  }

  const filtrados = chats.filter(c =>
    !busca || c.titulo.toLowerCase().includes(busca.toLowerCase()) ||
    c.msgs.some(m => m.content.toLowerCase().includes(busca.toLowerCase()))
  );
  const fixados  = filtrados.filter(c => c.fixado);
  const recentes = filtrados.filter(c => !c.fixado);

  return (
    <div style={{ height:"calc(100vh - 124px)", display:"flex", borderRadius:14, overflow:"hidden", border:"1px solid #1a1f38", background:"#080a12" }}>

      {/* Sidebar */}
      <div style={{ width:sb?234:0, flexShrink:0, background:"#06080f", borderRight:"1px solid #1a1f38", display:"flex", flexDirection:"column", transition:"width .22s", overflow:"hidden" }}>
        <div style={{ padding:"10px 9px", borderBottom:"1px solid #1a1f38" }}>
          <button onClick={novoChat} style={{ width:"100%", padding:"9px", background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", borderRadius:9, fontSize:13, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", gap:6, marginBottom:7 }}>
            ✏️ Nova Conversa
          </button>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍  Buscar..." style={{ padding:"7px 10px", fontSize:12 }}/>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"5px 5px" }}>
          {fixados.length>0 && <>
            <div style={{ fontSize:10, color:"#334155", fontWeight:700, padding:"6px 6px 2px", letterSpacing:".07em" }}>FIXADAS</div>
            {fixados.map(c => <ChatItem key={c.id} chat={c} ativo={c.id===chatId} onClick={()=>setChatId(c.id)} onFixar={()=>upd(c.id,x=>({...x,fixado:!x.fixado}))} onDeletar={()=>{setChats(p=>p.filter(x=>x.id!==c.id));if(chatId===c.id)setChatId(null);}}/>)}
          </>}
          {recentes.length>0 && <>
            <div style={{ fontSize:10, color:"#334155", fontWeight:700, padding:"6px 6px 2px", letterSpacing:".07em" }}>RECENTES</div>
            {recentes.map(c => <ChatItem key={c.id} chat={c} ativo={c.id===chatId} onClick={()=>setChatId(c.id)} onFixar={()=>upd(c.id,x=>({...x,fixado:!x.fixado}))} onDeletar={()=>{setChats(p=>p.filter(x=>x.id!==c.id));if(chatId===c.id)setChatId(null);}}/>)}
          </>}
          {filtrados.length===0 && <div style={{ textAlign:"center", padding:"28px 10px", color:"#334155", fontSize:12 }}>{busca?"Nenhum resultado":"Comece uma conversa"}</div>}
        </div>
        <div style={{ padding:"7px 10px", borderTop:"1px solid #1a1f38", textAlign:"center" }}>
          <span style={{ fontSize:10, color:"#334155" }}>{chats.length} conversa{chats.length!==1?"s":""}</span>
        </div>
      </div>

      {/* Chat Area */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", minWidth:0 }}>

        {/* Header */}
        <div style={{ padding:"10px 14px", borderBottom:"1px solid #1a1f38", display:"flex", alignItems:"center", gap:9, background:"#06080f", flexShrink:0 }}>
          <button onClick={()=>setSb(v=>!v)} style={{ background:"#111428", border:"1px solid #1a1f38", borderRadius:7, width:27, height:27, color:"#475569", fontSize:12, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{sb?"◀":"▶"}</button>
          <div style={{ width:32, height:32, borderRadius:9, background:"linear-gradient(135deg,#7c3aed,#22d3ee)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, animation:"glow 3s infinite", flexShrink:0 }}>🤖</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontWeight:700, fontSize:14 }}>ARIA <Badge cor="#22d3ee">IA Adaptativa</Badge></div>
            <div style={{ fontSize:11, color:"#475569" }}>{streaming?"digitando...":projetos.length>0?`${projetos.length} vídeo${projetos.length!==1?"s":""} analisados`:"pronta para ajudar"}</div>
          </div>
          {chatAtual && <button onClick={()=>upd(chatId,c=>({...c,fixado:!c.fixado}))} style={{ background:"none", border:"1px solid #1a1f38", borderRadius:7, padding:"4px 10px", fontSize:11, color:chatAtual.fixado?"#f59e0b":"#475569", cursor:"pointer" }}>{chatAtual.fixado?"📌 Fixada":"📌 Fixar"}</button>}
          <button onClick={novoChat} style={{ background:"#111428", border:"1px solid #1a1f38", borderRadius:7, padding:"5px 12px", fontSize:12, color:"#94a3b8", fontWeight:600 }}>+ Nova</button>
        </div>

        {/* Messages */}
        <div style={{ flex:1, overflowY:"auto", padding:"16px 18px", display:"flex", flexDirection:"column", gap:14 }}>
          {!chatAtual && (
            <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", textAlign:"center", padding:"20px" }}>
              <div style={{ fontSize:54, marginBottom:14, animation:"float 4s ease-in-out infinite" }}>🤖</div>
              <div style={{ fontWeight:800, fontSize:20, marginBottom:8 }}>Olá! Sou a ARIA.</div>
              <div style={{ color:"#64748b", fontSize:13, lineHeight:1.75, marginBottom:26, maxWidth:400 }}>
                Sua assistente de IA para criação de conteúdo viral.<br/>Aprendo com seus projetos e fico mais inteligente a cada conversa.
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:9, width:"100%", maxWidth:440 }}>
                {[
                  ["⚡","Crie um gancho viral para meu próximo vídeo"],
                  ["📊","Analise meu histórico e sugira temas"],
                  ["🎯","Quais formatos de vídeo estão em alta?"],
                  ["🧠","Estrutura de script para YouTube Shorts"],
                ].map(([ic,txt]) => (
                  <button key={txt} onClick={()=>setInput(txt)} style={{ background:"#0e1020", border:"1px solid #1a1f38", borderRadius:12, padding:"13px 14px", textAlign:"left", cursor:"pointer", transition:"border-color .15s, background .15s" }}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor="#2d3560";e.currentTarget.style.background="#111428"}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor="#1a1f38";e.currentTarget.style.background="#0e1020"}}>
                    <div style={{ fontSize:20, marginBottom:6 }}>{ic}</div>
                    <div style={{ fontSize:12, color:"#94a3b8", lineHeight:1.5 }}>{txt}</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {msgs.map(m => (
            <div key={m.id} style={{ display:"flex", justifyContent:m.role==="user"?"flex-end":"flex-start", gap:8, alignItems:"flex-end" }}>
              {m.role==="aria" && <div style={{ width:28, height:28, borderRadius:8, background:"linear-gradient(135deg,#7c3aed,#22d3ee)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, flexShrink:0 }}>🤖</div>}
              <div style={{ maxWidth:"76%", padding:"12px 16px", borderRadius:m.role==="user"?"18px 18px 4px 18px":"4px 18px 18px 18px", background:m.role==="user"?"linear-gradient(135deg,#7c3aed,#4f46e5)":m.erro?"rgba(244,63,94,.1)":"#111428", border:m.role==="aria"?`1px solid ${m.erro?"rgba(244,63,94,.3)":"#1a1f38"}`:"none", color:m.role==="user"?"white":m.erro?"#f43f5e":"#cbd5e1", fontSize:14, lineHeight:1.75, whiteSpace:"pre-wrap", wordBreak:"break-word" }}>
                {m.content}
              </div>
              {m.role==="user" && <div style={{ width:28, height:28, borderRadius:8, background:"linear-gradient(135deg,#6d28d9,#4338ca)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:800, flexShrink:0, color:"white" }}>U</div>}
            </div>
          ))}

          {streaming && (
            <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
              <div style={{ width:28, height:28, borderRadius:8, background:"linear-gradient(135deg,#7c3aed,#22d3ee)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, flexShrink:0 }}>🤖</div>
              <div style={{ maxWidth:"76%", padding:"12px 16px", borderRadius:"4px 18px 18px 18px", background:"#111428", border:"1px solid #1a1f38", color:"#cbd5e1", fontSize:14, lineHeight:1.75, whiteSpace:"pre-wrap", wordBreak:"break-word" }}>
                {streamTxt}<span style={{ display:"inline-block", width:2, height:15, background:"#a78bfa", marginLeft:2, verticalAlign:"middle", animation:"pulse .6s infinite" }}/>
              </div>
            </div>
          )}

          <div ref={fimRef}/>
        </div>

        {/* Input */}
        <div style={{ padding:"12px 16px 14px", borderTop:"1px solid #1a1f38", background:"#06080f", flexShrink:0 }}>
          <div style={{ display:"flex", gap:9, alignItems:"flex-end", background:"#111428", border:"1px solid #232848", borderRadius:14, padding:"9px 9px 9px 14px", transition:"border-color .2s" }}
            onFocusCapture={e=>e.currentTarget.style.borderColor="#8b5cf6"}
            onBlurCapture={e=>e.currentTarget.style.borderColor="#232848"}>
            <textarea
              ref={taRef}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar();}}}
              placeholder="Pergunte à ARIA... (Enter para enviar, Shift+Enter para nova linha)"
              rows={1}
              style={{ flex:1, padding:"4px 0", resize:"none", lineHeight:1.6, background:"transparent", border:"none", borderRadius:0, fontSize:14, maxHeight:140, overflowY:"auto" }}
            />
            <button onClick={enviar} disabled={streaming||!input.trim()} style={{ padding:"9px 15px", background:streaming||!input.trim()?"#1a1f38":"linear-gradient(135deg,#7c3aed,#4f46e5)", color:streaming||!input.trim()?"#475569":"white", borderRadius:10, fontSize:16, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, height:38, transition:"all .2s" }}>
              {streaming?<Spinner size={16} cor="#475569"/>:"↑"}
            </button>
          </div>
          <div style={{ textAlign:"center", marginTop:6, fontSize:10, color:"#1e2338" }}>ARIA · claude-sonnet-4-6 · Shift+Enter para nova linha</div>
        </div>
      </div>
    </div>
  );
}

// ─── CONFIGURAÇÕES ────────────────────────────────────────────
function Configuracoes({ apiKeys, setApiKeys, usuario }) {
  const [keys, setKeys] = useState(apiKeys);
  const [salvo, setSalvo] = useState(false);

  function salvar() { setApiKeys(keys); setSalvo(true); setTimeout(()=>setSalvo(false), 2000); }

  return (
    <div>
      <div style={{ fontWeight:800, fontSize:22, marginBottom:4 }}>Configurações</div>
      <div style={{ color:"#64748b", fontSize:14, marginBottom:24 }}>Configure suas API Keys para usar todas as funcionalidades</div>

      <div style={{ background:"#0c0f1c", border:"1px solid #1a1f38", borderRadius:14, padding:18, marginBottom:14, display:"flex", alignItems:"center", gap:14 }}>
        <div style={{ width:48, height:48, borderRadius:13, background:"linear-gradient(135deg,#7c3aed,#4f46e5)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>
          {usuario.nome[0].toUpperCase()}
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontWeight:700, fontSize:15 }}>{usuario.nome}</div>
          <div style={{ color:"#64748b", fontSize:13 }}>{usuario.email}</div>
        </div>
        <Badge cor={usuario.plano==="pro"?"#8b5cf6":usuario.plano==="agency"?"#f59e0b":"#64748b"}>{usuario.plano.toUpperCase()}</Badge>
      </div>

      <div style={{ fontWeight:700, fontSize:15, marginBottom:12 }}>🔑 API Keys</div>

      {[
        { key:"anthropic",   label:"Anthropic (Claude)",  placeholder:"sk-ant-...",  url:"https://console.anthropic.com", icon:"🤖", note:"Roteiros + ARIA (obrigatório)" },
        { key:"openai",      label:"OpenAI (DALL-E 3)",   placeholder:"sk-...",      url:"https://platform.openai.com",   icon:"🖼️", note:"Geração de imagens" },
        { key:"elevenlabs",  label:"ElevenLabs (TTS)",    placeholder:"...",         url:"https://elevenlabs.io",         icon:"🎙️", note:"Síntese de voz realista" },
      ].map(f => (
        <div key={f.key} style={{ background:"#0c0f1c", border:"1px solid #1a1f38", borderRadius:13, padding:16, marginBottom:10 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:17 }}>{f.icon}</span>
              <div>
                <div style={{ fontWeight:600, fontSize:13 }}>{f.label}</div>
                <div style={{ fontSize:11, color:"#475569" }}>{f.note}</div>
              </div>
            </div>
            <a href={f.url} target="_blank" style={{ fontSize:11, color:"#a78bfa", textDecoration:"none" }}>Obter →</a>
          </div>
          <input type="password" value={keys[f.key]||""} onChange={e=>setKeys(k=>({...k,[f.key]:e.target.value}))} placeholder={f.placeholder} style={{ padding:"10px 13px", fontFamily:"monospace", fontSize:12 }}/>
          <div style={{ marginTop:6, display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:7, height:7, borderRadius:"50%", background:(keys[f.key]?.length||0)>10?"#10b981":"#f43f5e" }}/>
            <span style={{ fontSize:11, color:"#475569" }}>{(keys[f.key]?.length||0)>10?"Configurada":"Não configurada"}</span>
          </div>
        </div>
      ))}

      <button onClick={salvar} style={{ background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", borderRadius:11, padding:"11px 26px", fontSize:14, fontWeight:700, boxShadow:"0 4px 16px rgba(124,58,237,.4)" }}>
        {salvo ? "✓ Salvo!" : "💾 Salvar configurações"}
      </button>
    </div>
  );
}

// ─── PLANOS ───────────────────────────────────────────────────
function PaginaPlanos({ usuario, onUpgrade, onVoltar }) {
  const [selecionado, setSel] = useState("pro");
  const [loading, setLoad]    = useState(false);
  const [sucesso, setSucesso] = useState(false);

  async function assinar() {
    setLoad(true); await sleep(1800);
    setLoad(false); setSucesso(true);
    await sleep(1200); onUpgrade(selecionado);
  }

  if (sucesso) return (
    <div style={{ minHeight:"100vh", background:"#04050a", display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ textAlign:"center" }} className="fade-up">
        <div style={{ fontSize:64, marginBottom:14 }}>🎉</div>
        <div style={{ fontWeight:900, fontSize:26, marginBottom:8 }}>Plano <span style={{ color:"#a78bfa" }}>{PLANOS.find(p=>p.id===selecionado)?.nome}</span> ativado!</div>
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth:900, margin:"0 auto", padding:20 }}>
      <button onClick={onVoltar} style={{ background:"#0c0f1c", border:"1px solid #1a1f38", color:"#94a3b8", borderRadius:9, padding:"8px 14px", fontSize:13, marginBottom:24 }}>← Voltar</button>
      <div style={{ textAlign:"center", marginBottom:36 }}>
        <div style={{ fontWeight:900, fontSize:28, letterSpacing:"-.02em", marginBottom:6 }}>
          Escolha seu <span style={{ background:"linear-gradient(135deg,#a78bfa,#22d3ee)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>plano</span>
        </div>
        <div style={{ color:"#64748b" }}>Cancele quando quiser. Sem fidelidade.</div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:16, marginBottom:32 }}>
        {PLANOS.map(p => (
          <div key={p.id} onClick={()=>setSel(p.id)} style={{ background:p.destaque?"linear-gradient(145deg,#111428,#161b33)":"#0c0f1c", border:`${selecionado===p.id?2:1}px solid ${selecionado===p.id?p.cor:"#1a1f38"}`, borderRadius:18, padding:24, cursor:"pointer", position:"relative", transition:"transform .2s", animation:p.destaque?"glow 3s infinite":"none" }}
            onMouseEnter={e=>e.currentTarget.style.transform="translateY(-3px)"}
            onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
            {p.destaque && <div style={{ position:"absolute", top:-12, left:"50%", transform:"translateX(-50%)", background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", padding:"3px 14px", borderRadius:99, fontSize:11, fontWeight:800, whiteSpace:"nowrap" }}>Mais Popular</div>}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <div style={{ fontWeight:800, fontSize:16, color:selecionado===p.id?p.cor:"#f8fafc" }}>{p.nome}</div>
              <div style={{ width:18, height:18, borderRadius:"50%", border:`2px solid ${p.cor}`, background:selecionado===p.id?p.cor:"transparent", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, color:"white" }}>{selecionado===p.id&&"✓"}</div>
            </div>
            <div style={{ marginBottom:16 }}>
              <span style={{ fontWeight:900, fontSize:32, color:p.cor }}>{p.preco===0?"Grátis":`R$${p.preco}`}</span>
              {p.preco>0&&<span style={{ color:"#64748b", fontSize:13 }}>/mês</span>}
            </div>
            {p.features.map((f,i) => <div key={i} style={{ fontSize:12, color:"#94a3b8", marginBottom:6, display:"flex", gap:7 }}><span style={{ color:p.cor }}>✓</span>{f}</div>)}
          </div>
        ))}
      </div>

      {selecionado !== "free" && (
        <div style={{ maxWidth:420, margin:"0 auto" }}>
          <div style={{ background:"#0c0f1c", border:"1px solid rgba(139,92,246,.3)", borderRadius:14, padding:24 }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:16 }}>💳 Dados de Pagamento</div>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              <input placeholder="Nome no cartão" style={{ padding:"11px 14px" }}/>
              <input placeholder="0000 0000 0000 0000" style={{ padding:"11px 14px", fontFamily:"monospace", letterSpacing:".1em" }}/>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <input placeholder="MM/AA" style={{ padding:"11px 14px" }}/>
                <input placeholder="CVV" style={{ padding:"11px 14px" }}/>
              </div>
              <button onClick={assinar} disabled={loading} style={{ padding:"13px", background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", borderRadius:11, fontSize:15, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", gap:9 }}>
                {loading ? <><Spinner size={18} cor="white"/>Processando...</> : `Assinar ${PLANOS.find(p=>p.id===selecionado)?.nome} — R$${PLANOS.find(p=>p.id===selecionado)?.preco}/mês`}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────
function App() {
  const [usuario, setUsuario]   = useLS("autovion_user", null);
  const [projetos, setProjetos] = useLS("autovion_projetos", []);
  const [apiKeys, setApiKeys]   = useLS("autovion_keys", { anthropic:"", openai:"", elevenlabs:"" });
  const [pagina, setPagina]     = useState("dashboard");
  const [vendo, setVendo]       = useState(null);
  const [planos, setPlanos]     = useState(false);
  const [sidebar, setSidebar]   = useState(true);

  if (!usuario) return <AuthScreen onLogin={u => setUsuario(u)}/>;
  if (planos) return <PaginaPlanos usuario={usuario} onUpgrade={plano=>{setUsuario({...usuario,plano,creditos:99999});setPlanos(false);}} onVoltar={()=>setPlanos(false)}/>;
  if (vendo)  return <VisualizadorVideo projeto={vendo} onFechar={()=>setVendo(null)}/>;

  function handleCriado(proj) {
    setProjetos([proj, ...projetos]);
    setVendo(proj);
    if (usuario.plano === "free") setUsuario({...usuario, creditos: Math.max(0,(usuario.creditos||0)-1)});
  }

  const NAV = [
    { id:"dashboard", icon:"▣", label:"Dashboard"     },
    { id:"criar",     icon:"⚡", label:"Criar Vídeo"   },
    { id:"aria",      icon:"🤖", label:"ARIA — IA"     },
    { id:"config",    icon:"⚙️", label:"Configurações" },
  ];

  return (
    <div style={{ display:"flex", minHeight:"100vh", background:"#04050a" }}>
      <aside style={{ width:sidebar?215:56, flexShrink:0, background:"#080a12", borderRight:"1px solid #1a1f38", display:"flex", flexDirection:"column", position:"sticky", top:0, height:"100vh", transition:"width .25s", overflow:"hidden" }}>
        <div style={{ padding:"16px 12px", borderBottom:"1px solid #1a1f38", display:"flex", alignItems:"center", justifyContent:sidebar?"space-between":"center" }}>
          {sidebar && <Logo/>}
          <button onClick={()=>setSidebar(v=>!v)} style={{ background:"#111428", border:"1px solid #1a1f38", borderRadius:8, width:26, height:26, color:"#64748b", fontSize:12, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            {sidebar?"◀":"▶"}
          </button>
        </div>
        <nav style={{ padding:"10px 8px", flex:1 }}>
          {NAV.map(item => (
            <div key={item.id} onClick={()=>setPagina(item.id)} style={{ display:"flex", alignItems:"center", gap:9, padding:"9px 11px", borderRadius:10, cursor:"pointer", marginBottom:3, justifyContent:sidebar?"flex-start":"center", background:pagina===item.id?"rgba(139,92,246,.15)":"transparent", color:pagina===item.id?"#a78bfa":"#64748b", border:`1px solid ${pagina===item.id?"rgba(139,92,246,.3)":"transparent"}`, transition:"all .15s", fontSize:14, fontWeight:500 }}>
              <span style={{ fontSize:15, flexShrink:0 }}>{item.icon}</span>
              {sidebar && <span>{item.label}</span>}
              {item.id==="aria" && sidebar && <span style={{ marginLeft:"auto", background:"rgba(34,211,238,.2)", color:"#22d3ee", borderRadius:99, fontSize:9, padding:"1px 6px", fontWeight:800 }}>AI</span>}
            </div>
          ))}
        </nav>
        {sidebar && (
          <div style={{ padding:"10px 12px", borderTop:"1px solid #1a1f38" }}>
            <div style={{ background:"rgba(139,92,246,.1)", border:"1px solid rgba(139,92,246,.25)", borderRadius:11, padding:"10px 12px", marginBottom:8 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ fontSize:11, color:"#a78bfa", fontWeight:700 }}>{usuario.plano.toUpperCase()}</span>
                {usuario.plano==="free" && <button onClick={()=>setPlanos(true)} style={{ background:"#7c3aed", border:"none", borderRadius:6, padding:"2px 7px", fontSize:10, color:"white", fontWeight:700, fontFamily:"'Outfit',sans-serif" }}>⬆</button>}
              </div>
              {usuario.plano==="free" && <>
                <div style={{ height:3, background:"#1a1f38", borderRadius:3, overflow:"hidden" }}>
                  <div style={{ height:"100%", background:"linear-gradient(90deg,#7c3aed,#22d3ee)", width:`${((3-(usuario.creditos||0))/3)*100}%` }}/>
                </div>
                <div style={{ fontSize:10, color:"#475569", marginTop:4 }}>{usuario.creditos||0}/3 créditos</div>
              </>}
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <div style={{ width:28, height:28, borderRadius:8, background:"linear-gradient(135deg,#7c3aed,#4f46e5)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:800, flexShrink:0 }}>{usuario.nome[0].toUpperCase()}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{usuario.nome}</div>
                <div style={{ fontSize:10, color:"#475569", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{usuario.email}</div>
              </div>
              <button onClick={()=>setUsuario(null)} style={{ background:"none", border:"none", color:"#475569", fontSize:12 }} title="Sair">↩</button>
            </div>
          </div>
        )}
      </aside>

      <div style={{ flex:1, minWidth:0, overflow:"auto", display:"flex", flexDirection:"column" }}>
        <header style={{ position:"sticky", top:0, background:"rgba(8,10,18,.9)", backdropFilter:"blur(12px)", borderBottom:"1px solid #1a1f38", padding:"12px 22px", display:"flex", alignItems:"center", justifyContent:"space-between", zIndex:50 }}>
          <div style={{ fontWeight:600, fontSize:14, color:"#64748b" }}>{NAV.find(n=>n.id===pagina)?.label}</div>
          <div style={{ display:"flex", gap:9 }}>
            <button onClick={()=>setPagina("criar")} style={{ background:"#111428", border:"1px solid #1a1f38", color:"#94a3b8", borderRadius:9, padding:"7px 15px", fontSize:13 }}>+ Novo Vídeo</button>
            {usuario.plano==="free" && <button onClick={()=>setPlanos(true)} style={{ background:"linear-gradient(135deg,#7c3aed,#4f46e5)", color:"white", borderRadius:9, padding:"7px 15px", fontSize:13, fontWeight:700, boxShadow:"0 4px 14px rgba(124,58,237,.4)" }}>⚡ Pro</button>}
          </div>
        </header>

        <main style={{ flex:1, padding:22 }}>
          {pagina==="dashboard" && <Dashboard projetos={projetos} onAbrir={setVendo} onDeletar={id=>setProjetos(projetos.filter(p=>p.id!==id))} usuario={usuario} onUpgrade={()=>setPlanos(true)}/>}
          {pagina==="criar"     && <PaginaCriar onCriado={handleCriado} usuario={usuario} apiKeys={apiKeys}/>}
          {pagina==="aria"      && <ARIAPanel projetos={projetos} apiKeys={apiKeys}/>}
          {pagina==="config"    && <Configuracoes apiKeys={apiKeys} setApiKeys={setApiKeys} usuario={usuario}/>}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
